name: Publish to TestPyPI

on:
  release:
    types: [prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish to TestPyPI (e.g. v0.4.0-rc1). Run this from the default branch."
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    environment:
      name: testpypi

    permissions:
      id-token: write   # REQUIRED for trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
